name: Collect weekly briefing

on:
  schedule:
    # Friday 08:00 AEST / 09:00 AEDT.
    - cron: "0 22 * * 4"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of source coverage
        required: true
        default: "7"

permissions:
  contents: read
  models: read

concurrency:
  group: collect-weekly-briefing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Test source and editorial rules
        run: npm run test:collectors

      - name: Collect and rank candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          REQUIRE_BRIEF_SUMMARIES: "true"
        run: npm run collect -- --cadence weekly --lookback-days "$LOOKBACK_DAYS" --require-summaries

      - name: Add readable run summary
        run: npm run summarize:draft -- --cadence weekly >> "$GITHUB_STEP_SUMMARY"

      - name: Retain run and source health for diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ai-weekly-run-${{ github.run_id }}
          path: |
            work/data/drafts/weekly/*.json
            work/data/source-health/weekly/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish the valid run to Sites
        env:
          SITES_INGEST_URL: ${{ secrets.SITES_INGEST_URL }}
          SITES_INGEST_TOKEN: ${{ secrets.SITES_INGEST_TOKEN }}
        run: npm run publish:latest -- --cadence weekly
