name: Collect daily briefing

on:
  schedule:
    # Every day at 08:00 AEST / 09:00 AEDT.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of source coverage
        required: true
        default: "3"

permissions:
  contents: read
  models: read

concurrency:
  group: collect-daily-briefing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Test source and editorial rules
        run: npm run test:collectors

      - name: Load recently published Daily links
        env:
          SITES_INGEST_URL: ${{ secrets.SITES_INGEST_URL }}
        run: npm run fetch:recent -- --cadence daily

      - name: Collect and rank candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: npm run collect -- --cadence daily --lookback-days "$LOOKBACK_DAYS" --exclude-file data/recent/daily.json

      - name: Add readable run summary
        run: npm run summarize:draft -- --cadence daily >> "$GITHUB_STEP_SUMMARY"

      - name: Retain run and source health for diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ai-daily-run-${{ github.run_id }}
          path: |
            work/data/drafts/daily/*.json
            work/data/source-health/daily/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish the valid run to Sites
        id: publish
        env:
          SITES_INGEST_URL: ${{ secrets.SITES_INGEST_URL }}
          SITES_INGEST_TOKEN: ${{ secrets.SITES_INGEST_TOKEN }}
        run: npm run publish:latest -- --cadence daily

      - name: Deliver the accepted Daily email
        if: steps.publish.outputs.email_eligible == 'true'
        env:
          SITES_INGEST_URL: ${{ secrets.SITES_INGEST_URL }}
          SITES_INGEST_TOKEN: ${{ secrets.SITES_INGEST_TOKEN }}
        run: npm run deliver:daily-email -- --run-id "${{ steps.publish.outputs.run_id }}"
