<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A fixed 320 pixel review frame for the Daily issue mockup."
    />
    <title>Daily mobile review · 75/25 reader mockups</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18211d;
        background: #e9e4d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        margin: 0;
        padding: 28px 16px 48px;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
      }

      a {
        color: #b64f37;
      }

      h1 {
        margin: 12px 0 6px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: #637068;
        font-size: 14px;
        line-height: 1.5;
      }

      .frame {
        width: 320px;
        max-width: 100%;
        height: 720px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #bbb3a4;
        border-radius: 20px;
        background: #f6f1e7;
        box-shadow: 0 18px 54px rgb(31 37 32 / 12%);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f6f1e7;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">← All mockups</a>
      <h1>Daily at 320px</h1>
      <p>Scroll inside the device frame. The page remains the same responsive Daily mockup.</p>
      <div class="frame">
        <iframe src="daily.html" title="Daily briefing at a 320 pixel viewport"></iframe>
      </div>
    </main>
  </body>
</html>
